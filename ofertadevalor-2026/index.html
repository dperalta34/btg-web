<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#04111A">
<title>Oferta de Valor BTG · 2026</title>
<link rel="icon" href="/favicon_btg.png">
<link rel="preload" href="/ofertadevalor-2026/pages/page-01.webp" as="image">
<style id="pw-gate-css">
:root{
  --dark:#081A26; --darker:#04111A; --card:#0D2233;
  --blue:#1A7FBC; --blue2:#2AACE0; --cyan:#00C9E0;
  --text-light:#E4EEF5; --heading:#F5F9FC; --muted:#7A94A2;
  --line:rgba(255,255,255,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--darker);color:var(--text-light);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html.pw-locked,body.pw-locked{overflow:hidden}

/* ===== Password gate ===== */
#pw-gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:28px;
  background:
    radial-gradient(900px 620px at 80% 0%, rgba(0,201,224,.14), transparent 60%),
    radial-gradient(820px 700px at 6% 110%, rgba(26,127,188,.16), transparent 55%),
    linear-gradient(160deg, var(--dark) 0%, var(--darker) 100%);
  transition:opacity .5s}
#pw-gate.unlocked{opacity:0;pointer-events:none}
.pw-box{width:100%;max-width:420px;padding:40px 32px 32px;border:1px solid var(--line);border-radius:18px;background:rgba(13,34,51,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.pw-logo{height:40px;margin:0 auto 18px;display:block}
.pw-badge{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,201,224,.3);padding:6px 12px;border-radius:999px;margin-bottom:18px}
.pw-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--heading);margin-bottom:10px}
.pw-sub{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:26px}
.pw-field{position:relative;margin-bottom:14px}
.pw-input{width:100%;padding:14px 46px 14px 16px;border:1px solid var(--line);border-radius:10px;background:rgba(4,17,26,.6);color:var(--heading);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .2s,background .2s}
.pw-input:focus{border-color:var(--blue2);background:rgba(4,17,26,.9)}
.pw-input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border-radius:7px}
.pw-eye:hover{color:var(--text-light);background:rgba(255,255,255,.04)}
.pw-btn{width:100%;padding:13px 16px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.pw-btn:hover{background:var(--blue2)}
.pw-err{min-height:18px;font-size:13px;color:#F28B82;margin-top:10px}
.pw-foot{margin-top:22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7}

/* ===== Stage ===== */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--darker)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(4,17,26,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex:0 0 auto;z-index:5}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand img{height:26px;display:block}
.brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px}
.counter{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px;font-weight:500}
.counter b{color:var(--cyan);font-weight:700}
.tool-btn{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.03);color:var(--text-light);font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:background .2s,border-color .2s;text-decoration:none}
.tool-btn:hover{background:rgba(26,127,188,.16);border-color:rgba(42,172,224,.4)}
.tool-btn svg{width:16px;height:16px}
.tool-btn.icon-only{padding:0;width:38px;justify-content:center}

/* ===== Page viewer ===== */
.viewer{flex:1 1 auto;position:relative;overflow:hidden;padding:env(safe-area-inset-bottom) 0 env(safe-area-inset-bottom)}
.flip-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:3000px;padding:24px 90px}
.page-frame{position:relative;width:100%;height:100%;max-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.page{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 30px 90px rgba(0,0,0,.55),0 10px 32px rgba(0,0,0,.35);border-radius:4px;background:#000;transition:transform .55s cubic-bezier(.5,.05,.3,.95),opacity .3s ease-out;will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.page.flip-out-left{transform:translate(-50%,-50%) rotateY(-105deg);transform-origin:left center;opacity:0}
.page.flip-out-right{transform:translate(-50%,-50%) rotateY(105deg);transform-origin:right center;opacity:0}
.page.flip-in-right{animation:flipInRight .55s cubic-bezier(.5,.05,.3,.95) forwards}
.page.flip-in-left{animation:flipInLeft .55s cubic-bezier(.5,.05,.3,.95) forwards}
@keyframes flipInRight{
  0%{transform:translate(-50%,-50%) rotateY(105deg);transform-origin:right center;opacity:0}
  100%{transform:translate(-50%,-50%) rotateY(0);transform-origin:right center;opacity:1}
}
@keyframes flipInLeft{
  0%{transform:translate(-50%,-50%) rotateY(-105deg);transform-origin:left center;opacity:0}
  100%{transform:translate(-50%,-50%) rotateY(0);transform-origin:left center;opacity:1}
}

/* ===== Arrows ===== */
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:rgba(13,34,51,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text-light);display:grid;place-items:center;cursor:pointer;z-index:3;transition:background .2s,border-color .2s,opacity .2s,transform .15s}
.nav-arrow:hover:not(:disabled){background:rgba(26,127,188,.3);border-color:var(--blue2);transform:translateY(-50%) scale(1.06)}
.nav-arrow:active:not(:disabled){transform:translateY(-50%) scale(.96)}
.nav-arrow:disabled{opacity:.25;cursor:not-allowed}
.nav-arrow svg{width:22px;height:22px}
.nav-arrow.left{left:20px}
.nav-arrow.right{right:20px}

/* ===== Jump bar ===== */
.jump-bar{display:none;flex:0 0 auto;align-items:center;justify-content:center;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(4,17,26,.75);font-size:13px;color:var(--muted)}
.jump-bar input[type=range]{flex:1;max-width:400px}

@media (max-width:640px){
  .top-bar{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
  .brand .tag{display:none}
  .tool-btn{height:36px;padding:0 10px;font-size:12px}
  .tool-btn .label{display:none}
  .tool-btn{padding:0;width:36px;justify-content:center}
  .counter{font-size:11px;padding:0 6px}
  .flip-stage{padding:12px 70px}
  .nav-arrow{width:46px;height:46px}
  .nav-arrow.left{left:10px}
  .nav-arrow.right{right:10px}
}
@media (max-width:400px){
  .flip-stage{padding:8px 56px}
  .nav-arrow{width:40px;height:40px}
  .nav-arrow svg{width:18px;height:18px}
}

.loader{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s}
.loader.on{opacity:1}
.loader .dot{display:inline-block;width:7px;height:7px;background:var(--cyan);border-radius:50%;margin:0 3px;animation:bounce 1.1s infinite ease-in-out}
.loader .dot:nth-child(2){animation-delay:.15s}
.loader .dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.5}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<!-- ============ PASSWORD GATE ============ -->
<div id="pw-gate" role="dialog" aria-labelledby="pw-title" aria-modal="true">
  <div class="pw-box">
    <img src="/btg-logo.png" alt="BTG Seguros" class="pw-logo" onerror="this.style.display='none'">
    <div class="pw-badge">Documento Privado</div>
    <h1 class="pw-title" id="pw-title">Oferta de Valor 2026</h1>
    <div class="pw-sub">Escribe la contraseña<br>para acceder a la presentación</div>
    <form class="pw-field" id="pw-form" autocomplete="off" novalidate>
      <input type="password" class="pw-input" id="pw-input" placeholder="Contraseña" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <button class="pw-eye" id="pw-eye" type="button" aria-label="Mostrar contraseña">
        <svg id="pw-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <svg id="pw-eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </form>
    <button class="pw-btn" id="pw-submit" type="button">Acceder</button>
    <div class="pw-err" id="pw-err" aria-live="polite"></div>
    <div class="pw-foot">BTG · Black Tower Group</div>
  </div>
</div>

<!-- ============ STAGE ============ -->
<div class="stage" id="stage" aria-hidden="true">
  <div class="top-bar">
    <a href="/" class="brand">
      <img src="/btg-logo.png" alt="BTG" onerror="this.style.display='none'">
      <span class="tag">Oferta de Valor · 2026</span>
    </a>
    <div class="tools">
      <span class="counter"><b id="cur-page">1</b> / <span id="tot-page">40</span></span>
      <a class="tool-btn" id="dl-btn" href="/ofertadevalor-2026/pai-btg-2026.pdf" download="PAI BTG 2026.pdf" title="Descargar PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="label">Descargar</span>
      </a>
      <button class="tool-btn icon-only" id="fs-btn" title="Pantalla completa" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <button class="nav-arrow left" id="prev-btn" aria-label="Página anterior" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="flip-stage">
      <div class="page-frame">
        <img class="page" id="page-img" alt="Página 1" draggable="false">
      </div>
    </div>
    <button class="nav-arrow right" id="next-btn" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <div class="loader" id="loader"><span>Cargando<span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
  </div>
</div>

<script>
(function(){
  var html=document.documentElement,body=document.body;
  html.classList.add('pw-locked');body.classList.add('pw-locked');
  var KEY='btg_pai_2026',PWD='Pai-2026-BTG';
  var gate=document.getElementById('pw-gate');
  var inp=document.getElementById('pw-input');
  var btn=document.getElementById('pw-submit');
  var form=document.getElementById('pw-form');
  var err=document.getElementById('pw-err');
  var stage=document.getElementById('stage');
  var eyeBtn=document.getElementById('pw-eye');
  var eyeOff=document.getElementById('pw-eye-off');
  var eyeOn=document.getElementById('pw-eye-on');

  function unlock(){
    try{sessionStorage.setItem(KEY,'1');}catch(e){}
    gate.classList.add('unlocked');
    html.classList.remove('pw-locked');body.classList.remove('pw-locked');
    stage.setAttribute('aria-hidden','false');
    setTimeout(function(){if(gate&&gate.parentNode)gate.parentNode.removeChild(gate);initViewer();},520);
  }
  try{if(sessionStorage.getItem(KEY)==='1'){unlock();return;}}catch(e){}

  function attempt(){
    if(inp.value===PWD){unlock();}
    else{
      err.textContent='Contraseña incorrecta';
      inp.classList.add('shake');inp.value='';
      setTimeout(function(){inp.classList.remove('shake');err.textContent='';inp.focus();},400);
    }
  }
  btn.addEventListener('click',attempt);
  form.addEventListener('submit',function(e){e.preventDefault();attempt();});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();attempt();}});
  var shown=false;
  eyeBtn.addEventListener('click',function(){
    shown=!shown;inp.type=shown?'text':'password';
    eyeOff.style.display=shown?'none':'';eyeOn.style.display=shown?'':'none';
    inp.focus();
  });
  setTimeout(function(){try{inp.focus();}catch(e){}},50);

  function initViewer(){
    var TOTAL=40;
    var pageUrl=function(i){return '/ofertadevalor-2026/pages/page-'+String(i).padStart(2,'0')+'.webp';};
    var img=document.getElementById('page-img');
    var curEl=document.getElementById('cur-page');
    var totEl=document.getElementById('tot-page');
    var prevB=document.getElementById('prev-btn');
    var nextB=document.getElementById('next-btn');
    var loader=document.getElementById('loader');

    totEl.textContent=TOTAL;
    var cur=1;
    var animating=false;
    var preloaded={};

    function preload(i){
      if(i<1||i>TOTAL||preloaded[i])return;
      var im=new Image();
      im.src=pageUrl(i);
      preloaded[i]=im;
    }

    function syncNav(){
      curEl.textContent=cur;
      prevB.disabled=cur<=1;
      nextB.disabled=cur>=TOTAL;
    }

    function go(target,dir){
      if(animating||target<1||target>TOTAL||target===cur)return;
      animating=true;
      var outCls=dir==='next'?'flip-out-left':'flip-out-right';
      var inCls=dir==='next'?'flip-in-right':'flip-in-left';
      preload(target+(dir==='next'?1:-1));

      // Preload target first to avoid flash
      var next=new Image();
      next.onload=function(){
        img.classList.add(outCls);
        setTimeout(function(){
          img.src=next.src;
          img.alt='Página '+target;
          img.classList.remove(outCls);
          // force reflow
          void img.offsetWidth;
          img.classList.add(inCls);
          setTimeout(function(){
            img.classList.remove(inCls);
            animating=false;
          },560);
        },310);
        cur=target;
        syncNav();
      };
      next.onerror=function(){animating=false;};
      next.src=pageUrl(target);
    }

    // Initial page
    img.src=pageUrl(1);
    img.alt='Página 1';
    syncNav();
    preload(2);preload(3);

    prevB.addEventListener('click',function(){go(cur-1,'prev');});
    nextB.addEventListener('click',function(){go(cur+1,'next');});
    document.addEventListener('keydown',function(e){
      if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
      if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1,'prev');e.preventDefault();}
      else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(cur+1,'next');e.preventDefault();}
      else if(e.key==='Home'){go(1,'prev');}
      else if(e.key==='End'){go(TOTAL,'next');}
    });

    // Touch swipe
    var tStart=null;
    var viewer=document.getElementById('viewer');
    viewer.addEventListener('touchstart',function(e){if(e.touches.length===1)tStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};},{passive:true});
    viewer.addEventListener('touchend',function(e){
      if(!tStart)return;
      var t=e.changedTouches[0];
      var dx=t.clientX-tStart.x,dy=t.clientY-tStart.y,dt=Date.now()-tStart.t;
      tStart=null;
      if(dt<600&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
        if(dx<0)go(cur+1,'next');else go(cur-1,'prev');
      }
    },{passive:true});

    // Fullscreen
    document.getElementById('fs-btn').addEventListener('click',function(){
      if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
      else{document.exitFullscreen&&document.exitFullscreen();}
    });

    // Image load state
    img.addEventListener('load',function(){loader.classList.remove('on');});
    img.addEventListener('error',function(){loader.classList.remove('on');});
  }
})();
</script>
</body>
</html>
