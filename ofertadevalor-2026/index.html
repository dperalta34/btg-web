<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#04111A">
<title>Oferta de Valor BTG · 2026</title>
<link rel="icon" href="/favicon_btg.png">
<style id="pw-gate-css">
:root{
  --dark:#081A26; --darker:#04111A; --card:#0D2233;
  --blue:#1A7FBC; --blue2:#2AACE0; --cyan:#00C9E0; --gold:#B8962E;
  --text-light:#E4EEF5; --heading:#F5F9FC; --muted:#7A94A2;
  --line:rgba(255,255,255,.07);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--darker);color:var(--text-light);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
html.pw-locked,body.pw-locked{overflow:hidden}

#pw-gate{position:fixed;inset:0;z-index:1000;background:
  radial-gradient(900px 620px at 80% 0%, rgba(0,201,224,.14), transparent 60%),
  radial-gradient(820px 700px at 6% 110%, rgba(26,127,188,.16), transparent 55%),
  linear-gradient(160deg, var(--dark) 0%, var(--darker) 100%);
  display:flex;align-items:center;justify-content:center;padding:28px;transition:opacity .5s}
#pw-gate.unlocked{opacity:0;pointer-events:none}
.pw-box{width:100%;max-width:420px;padding:40px 32px 32px;border:1px solid var(--line);border-radius:18px;background:rgba(13,34,51,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.pw-logo{height:40px;margin:0 auto 18px;display:block}
.pw-badge{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,201,224,.3);padding:6px 12px;border-radius:999px;margin-bottom:18px}
.pw-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--heading);margin-bottom:10px}
.pw-sub{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:26px;font-weight:400}
.pw-field{position:relative;margin-bottom:14px}
.pw-input{width:100%;padding:14px 46px 14px 16px;border:1px solid var(--line);border-radius:10px;background:rgba(4,17,26,.6);color:var(--heading);font-family:var(--sans);font-size:15px;letter-spacing:.02em;outline:none;transition:border-color .2s,background .2s}
.pw-input:focus{border-color:var(--blue2);background:rgba(4,17,26,.9)}
.pw-input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border-radius:7px}
.pw-eye:hover{color:var(--text-light);background:rgba(255,255,255,.04)}
.pw-btn{width:100%;padding:13px 16px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:background .2s,transform .1s}
.pw-btn:hover{background:var(--blue2)}
.pw-btn:active{transform:scale(.98)}
.pw-err{min-height:18px;font-size:13px;color:#F28B82;margin-top:10px}
.pw-foot{margin-top:22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.7}

/* Book stage */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--darker);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(4,17,26,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex:0 0 auto}
.top-bar .brand{display:flex;align-items:center;gap:12px}
.top-bar .brand img{height:26px;display:block}
.top-bar .brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top-bar .right-tools{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.03);color:var(--text-light);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.icon-btn:hover{background:rgba(26,127,188,.14);border-color:rgba(42,172,224,.4)}
.icon-btn svg{width:17px;height:17px}

.book-wrap{flex:1 1 auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px}
#flipbook{margin:0 auto}
#flipbook .page-img{width:100%;height:100%;background:#000;background-size:cover;background-position:center}

.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(4,17,26,.75);flex:0 0 auto}
.nav-bar .mid{flex:1;text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.nav-bar .mid b{color:var(--cyan);font-weight:600}
.nav-btn{min-width:46px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);color:var(--text-light);font-size:13px;font-weight:500;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .2s,border-color .2s}
.nav-btn:hover{background:rgba(26,127,188,.14);border-color:rgba(42,172,224,.4)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn svg{width:14px;height:14px}

.loader{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.loader .dot{display:inline-block;width:8px;height:8px;background:var(--cyan);border-radius:50%;margin:0 3px;animation:bounce 1.1s infinite ease-in-out}
.loader .dot:nth-child(2){animation-delay:.15s}
.loader .dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.5}40%{transform:scale(1);opacity:1}}

@media (max-width:640px){
  .top-bar{padding:12px 14px}
  .top-bar .brand .tag{display:none}
  .nav-bar{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .nav-btn{padding:9px 12px;font-size:12px}
  .book-wrap{padding:10px}
}
</style>
</head>
<body>

<!-- ============ PASSWORD GATE ============ -->
<div id="pw-gate" role="dialog" aria-labelledby="pw-title" aria-modal="true">
  <div class="pw-box">
    <img src="/btg-logo.png" alt="BTG Seguros" class="pw-logo" onerror="this.style.display='none'">
    <div class="pw-badge">Documento Privado</div>
    <h1 class="pw-title" id="pw-title">Oferta de Valor 2026</h1>
    <div class="pw-sub">Escribe la contraseña<br>para acceder a la presentación</div>
    <form class="pw-field" id="pw-form" autocomplete="off" novalidate>
      <input type="password" class="pw-input" id="pw-input" placeholder="Contraseña" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <button class="pw-eye" id="pw-eye" type="button" aria-label="Mostrar contraseña">
        <svg id="pw-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <svg id="pw-eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </form>
    <button class="pw-btn" id="pw-submit" type="button">Acceder</button>
    <div class="pw-err" id="pw-err" aria-live="polite"></div>
    <div class="pw-foot">BTG · Black Tower Group</div>
  </div>
</div>

<!-- ============ FLIPBOOK ============ -->
<div class="stage" id="stage" aria-hidden="true">
  <div class="top-bar">
    <a href="/" class="brand" style="text-decoration:none;color:inherit">
      <img src="/btg-logo.png" alt="BTG Seguros" onerror="this.style.display='none'">
      <span class="tag">Oferta de Valor · 2026</span>
    </a>
    <div class="right-tools">
      <button class="icon-btn" id="fs-btn" title="Pantalla completa" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </div>

  <div class="book-wrap">
    <div class="loader" id="loader"><span>Cargando<span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
    <div id="flipbook"></div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="prev-btn" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Anterior
    </button>
    <div class="mid"><b id="cur-page">1</b> / <span id="tot-page">40</span></div>
    <button class="nav-btn" id="next-btn" aria-label="Siguiente">
      Siguiente
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  var html=document.documentElement,body=document.body;
  html.classList.add('pw-locked');body.classList.add('pw-locked');
  var KEY='btg_pai_2026',PWD='Pai-2026-BTG';
  var gate=document.getElementById('pw-gate');
  var inp=document.getElementById('pw-input');
  var btn=document.getElementById('pw-submit');
  var form=document.getElementById('pw-form');
  var err=document.getElementById('pw-err');
  var stage=document.getElementById('stage');
  var eyeBtn=document.getElementById('pw-eye');
  var eyeOff=document.getElementById('pw-eye-off');
  var eyeOn=document.getElementById('pw-eye-on');

  function unlock(){
    try{sessionStorage.setItem(KEY,'1');}catch(e){}
    gate.classList.add('unlocked');
    html.classList.remove('pw-locked');body.classList.remove('pw-locked');
    stage.setAttribute('aria-hidden','false');
    setTimeout(function(){
      if(gate&&gate.parentNode)gate.parentNode.removeChild(gate);
      var css=document.getElementById('pw-gate-css');
      // keep CSS, flipbook also uses tokens
      initBook();
    },520);
  }
  try{if(sessionStorage.getItem(KEY)==='1'){unlock();return;}}catch(e){}

  function attempt(){
    if(inp.value===PWD){unlock();}
    else{
      err.textContent='Contraseña incorrecta';
      inp.classList.add('shake');inp.value='';
      setTimeout(function(){inp.classList.remove('shake');err.textContent='';inp.focus();},400);
    }
  }
  btn.addEventListener('click',attempt);
  form.addEventListener('submit',function(e){e.preventDefault();attempt();});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();attempt();}});
  var shown=false;
  eyeBtn.addEventListener('click',function(){
    shown=!shown;inp.type=shown?'text':'password';
    eyeOff.style.display=shown?'none':'';eyeOn.style.display=shown?'':'none';
    inp.focus();
  });
  setTimeout(function(){try{inp.focus();}catch(e){}},50);

  function initBook(){
    var TOTAL=40;
    var pages=[];
    for(var i=1;i<=TOTAL;i++){
      pages.push('/ofertadevalor-2026/pages/page-'+String(i).padStart(2,'0')+'.jpg');
    }
    var el=document.getElementById('flipbook');
    var pf=new St.PageFlip(el,{
      width:1600,
      height:900,
      size:'stretch',
      minWidth:320,
      maxWidth:2000,
      minHeight:180,
      maxHeight:1125,
      drawShadow:true,
      maxShadowOpacity:.5,
      showCover:false,
      flippingTime:650,
      usePortrait:true,
      mobileScrollSupport:false,
      swipeDistance:30,
      clickEventForward:false
    });
    pf.loadFromImages(pages);
    document.getElementById('loader').style.display='none';
    document.getElementById('tot-page').textContent=TOTAL;

    var cur=document.getElementById('cur-page');
    var prevB=document.getElementById('prev-btn');
    var nextB=document.getElementById('next-btn');
    function syncNav(){
      var p=pf.getCurrentPageIndex()+1;
      cur.textContent=p;
      prevB.disabled=p<=1;
      nextB.disabled=p>=TOTAL;
    }
    pf.on('flip',syncNav);
    syncNav();

    prevB.addEventListener('click',function(){pf.flipPrev();});
    nextB.addEventListener('click',function(){pf.flipNext();});
    document.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft'||e.key==='PageUp'){pf.flipPrev();}
      else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){pf.flipNext();e.preventDefault();}
      else if(e.key==='Home'){pf.turnToPage(0);}
      else if(e.key==='End'){pf.turnToPage(TOTAL-1);}
    });

    var fsBtn=document.getElementById('fs-btn');
    fsBtn.addEventListener('click',function(){
      if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
      else{document.exitFullscreen&&document.exitFullscreen();}
    });
  }
})();
</script>
</body>
</html>
