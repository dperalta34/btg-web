<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CEVER — BTG Seguros</title>
<link rel="icon" type="image/png" href="/favicon_btg.png">
<meta name="description" content="Un homenaje de BTG Seguros a CEVER.">
<meta name="robots" content="noindex,nofollow">

<meta property="og:title" content="CEVER — BTG Seguros">
<meta property="og:description" content="Hay caminos que se recorren. Y otros que hacen historia.">
<meta property="og:type" content="website">

<link rel="preload" as="image" href="/CEVER/fx/f_0001.webp" type="image/webp" fetchpriority="high">
<link rel="preload" as="image" href="/CEVER/fx/f_0315.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#081A26; --darker:#04111A; --card:#0D2233;
  --blue:#1A7FBC; --blue2:#2AACE0; --cyan:#00C9E0; --gold:#B8962E;
  --white:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --serif:"Cormorant Garamond","EB Garamond",Georgia,serif;
}
html,body{background:#04111A;color:#F5F9FC;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body{line-height:1.55;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{display:block;max-width:100%}
/* iOS-safe viewport unit */
:root{--vh:1vh}

/* Ambient background */
.bg-ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 780px at 50% 18%, rgba(26,127,188,0.16), transparent 60%),
    radial-gradient(900px 700px at 82% 82%, rgba(0,201,224,0.07), transparent 60%),
    linear-gradient(180deg, #04111A 0%, #081A26 55%, #04111A 100%);
}
.bg-ambient::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:3px 3px;opacity:.5;mix-blend-mode:overlay;}

/* Stage */
.stage{position:relative;z-index:1}

/* Leyenda */
.leyenda{min-height:100vh;min-height:calc(var(--vh) * 100);min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:80px 32px 120px;text-align:center;position:relative;will-change:opacity}

.hero-logo{height:56px;width:auto;margin:0 auto 46px;
  opacity:0;transform:translateY(-8px);
  animation:rise 1.1s .1s cubic-bezier(.16,1,.3,1) forwards;
  filter:drop-shadow(0 0 24px rgba(0,201,224,0.15))}

.eyebrow{font-size:11px;letter-spacing:.36em;text-transform:uppercase;
  color:var(--cyan);opacity:0;transform:translateY(10px);
  animation:rise 1s .55s ease forwards;margin-bottom:56px;
  display:inline-flex;align-items:center;gap:16px}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,201,224,0.6),transparent)}

.line{max-width:22ch;margin:0 auto;opacity:0;transform:translateY(28px);filter:blur(8px);
  animation:reveal 1.4s cubic-bezier(.16,1,.3,1) forwards}
.l1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4.8vw,62px);line-height:1.18;letter-spacing:-.005em;color:#F5F9FC;animation-delay:.85s}
.l1 em{font-style:italic;color:var(--cyan);text-shadow:0 0 42px rgba(0,201,224,0.4)}
.l2{margin-top:38px;font-family:var(--font);font-weight:200;font-size:clamp(17px,1.9vw,22px);line-height:1.7;letter-spacing:.005em;color:rgba(228,238,245,0.72);max-width:46ch;animation-delay:1.45s}
.l3{margin-top:44px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(20px,2.6vw,32px);line-height:1.4;color:#F5F9FC;max-width:34ch;animation-delay:2.05s}

.divider{width:1px;height:56px;background:linear-gradient(180deg,rgba(0,201,224,0.55),transparent);
  margin:66px auto 0;opacity:0;animation:rise 1s 2.7s ease forwards}

.scroll-cue{position:absolute;bottom:36px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(228,238,245,0.36);opacity:0;
  animation:rise .8s 3s ease forwards}
.scroll-cue span{padding-left:.32em;text-indent:0;display:inline-block}
.scroll-cue svg{opacity:.55;animation:bob 2.4s ease-in-out infinite 3.5s}

/* Spacer that provides scroll room for the fixed viewer */
.scrub-space{height:100vh;height:calc(var(--vh) * 100);height:100svh;position:relative;z-index:0}

/* Fixed cinematic viewer — always in place, opacity driven by scroll */
.viewer{position:fixed;inset:0;height:100vh;height:calc(var(--vh) * 100);height:100dvh;z-index:40;pointer-events:none;
  opacity:0;will-change:opacity;background:#04111A;overflow:hidden;transform:translateZ(0);-webkit-transform:translateZ(0)}
.viewer-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:transparent;z-index:2}
/* Extremely subtle vignette */
.viewer::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(140% 95% at 50% 55%, transparent 70%, rgba(4,17,26,0.28) 100%);}

/* Ending overlay (signature over last frame) */
.ending{position:absolute;inset:0;z-index:4;pointer-events:none;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 32px 9vh;text-align:center;
  opacity:0;transition:opacity .55s ease;
  background:linear-gradient(180deg, transparent 45%, rgba(4,17,26,0.55) 80%, rgba(4,17,26,0.92) 100%);}
.ending.in{opacity:1}
.ending .sig-rule{width:96px;height:1px;background:linear-gradient(90deg,transparent,rgba(184,150,46,0.88),transparent);margin:0 auto 30px;
  transform:scaleX(0);transform-origin:center;transition:transform .8s .1s cubic-bezier(.16,1,.3,1)}
.ending.in .sig-rule{transform:scaleX(1)}
.ending .sig-mark{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(18px,1.9vw,22px);color:rgba(228,238,245,0.95);letter-spacing:.01em;margin-bottom:26px;text-shadow:0 2px 14px rgba(0,0,0,0.7);
  transform:translateY(10px);transition:transform .8s .2s cubic-bezier(.16,1,.3,1)}
.ending.in .sig-mark{transform:none}
.ending .sig-logo{height:52px;width:auto;margin:0 auto;opacity:.98;filter:drop-shadow(0 4px 24px rgba(0,0,0,0.7));
  transform:translateY(10px);transition:transform .8s .35s cubic-bezier(.16,1,.3,1)}
.ending.in .sig-logo{transform:none}

/* Loading overlay */
.viewer-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:5;color:rgba(228,238,245,0.7);font-size:10px;letter-spacing:.36em;text-transform:uppercase;
  transition:opacity .7s ease;pointer-events:none;gap:22px;background:rgba(4,17,26,0.65);backdrop-filter:blur(6px)}
.viewer-loading.hide{opacity:0}
.loading-bar{width:180px;height:2px;background:rgba(255,255,255,0.08);overflow:hidden;border-radius:2px}
.loading-fill{width:100%;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));
  transform:scaleX(0);transform-origin:left;transition:transform .18s ease;
  box-shadow:0 0 12px rgba(0,201,224,0.6)}

/* Animations */
@keyframes reveal{to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

@media (max-width:720px){
  .leyenda{padding:60px 22px 90px}
  .hero-logo{height:44px;margin-bottom:38px}
  .eyebrow{font-size:10px;letter-spacing:.28em;margin-bottom:44px;gap:10px}
  .eyebrow::before,.eyebrow::after{width:24px}
  .l2{margin-top:30px}
  .l3{margin-top:34px}
  .divider{margin-top:48px;height:44px}
  .ending{padding:0 22px 6vh;justify-content:flex-end}
  .ending .sig-logo{height:42px}
  .ending .sig-mark{margin-bottom:20px}
  /* Stronger gradient on mobile so signature reads well over letterbox */
  .ending{background:linear-gradient(180deg, transparent 55%, rgba(4,17,26,0.7) 82%, rgba(4,17,26,0.95) 100%)}
  /* Shorter spacer on mobile → one flick reveals most of the video */
  .scrub-space{height:60vh;height:calc(var(--vh) * 60);height:60svh}
}
@media (prefers-reduced-motion:reduce){
  .line,.eyebrow,.divider,.scroll-cue,.hero-logo{animation:none;opacity:1;transform:none;filter:none}
  .scroll-cue svg{animation:none}
}
</style>
</head>
<body>
<div class="bg-ambient"></div>

<main class="stage">
  <section class="leyenda" id="leyenda">
    <img class="hero-logo" src="/CEVER/logo-btg-blanco.png" alt="BTG Seguros">
    <div class="eyebrow">Para CEVER</div>
    <p class="line l1">Hay caminos que se recorren. Y otros que <em>hacen historia.</em></p>
    <p class="line l2">Celebramos su éxito, pero sobre todo, todo lo que aún está por venir.</p>
    <p class="line l3">Muchas Felicidades y qué orgullo poder avanzar juntos hacia lo que sigue.</p>
    <div class="divider"></div>
    <div class="scroll-cue" aria-hidden="true">
      <span>Desliza</span>
      <svg width="14" height="20" viewBox="0 0 14 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4v12M2 11l5 5 5-5"/>
      </svg>
    </div>
  </section>

  <div class="scrub-space" aria-hidden="true"></div>
</main>

<div class="viewer" id="viewer" aria-hidden="true">
  <canvas class="viewer-canvas" id="canvas"></canvas>
  <div class="ending" id="ending">
    <div class="sig-rule"></div>
    <p class="sig-mark">con admiración,</p>
    <img class="sig-logo" src="/CEVER/logo-btg-blanco.png" alt="BTG Seguros">
  </div>
  <div class="viewer-loading" id="loading">
    <div class="loading-bar"><div class="loading-fill" id="fill"></div></div>
    <span>Preparando</span>
  </div>
</div>

<script>
(function(){
  const FRAMES = 315;
  const isMobile = window.matchMedia('(max-width:720px)').matches;
  const dir = isMobile ? '/CEVER/fx-m' : '/CEVER/fx';
  const pad = (n) => String(n).padStart(4, '0');
  const framePath = (i) => dir + '/f_' + pad(i + 1) + '.webp';

  // iOS-safe viewport height (mobile Safari's URL bar changes 100vh)
  function setVH(){
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--vh', (h / 100) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setVH);

  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d', { alpha:false, desynchronized:true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const leyenda = document.getElementById('leyenda');
  const viewer  = document.getElementById('viewer');
  const loading = document.getElementById('loading');
  const fill    = document.getElementById('fill');
  const ending  = document.getElementById('ending');

  const images = new Array(FRAMES);
  let loaded = 0;
  let readyToShow = false;
  let target = 0, current = 0, raf = 0;

  function sizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 2.5 : 2);
    const w = window.innerWidth;
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  function drawFrame(idxFloat){
    const idx = Math.max(0, Math.min(FRAMES - 1, Math.round(idxFloat)));
    const img = images[idx];
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = canvas.width, ch = canvas.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    // Portrait → contain (full video visible). Landscape → cover.
    const isPortrait = ch >= cw;
    const s = isPortrait ? Math.min(cw / iw, ch / ih) : Math.max(cw / iw, ch / ih);
    const dw = iw * s, dh = ih * s;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    ctx.fillStyle = '#04111A';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, dx, dy, dw, dh);

    // MOBILE portrait: soften the exact top/bottom edges of the video into the site bg
    if (isPortrait && isMobile){
      const fade = Math.round(dh * 0.22);  // 22% of video height fades on each edge
      // Top edge: solid site bg → transparent, painted just inside the video area
      const gTop = ctx.createLinearGradient(0, dy, 0, dy + fade);
      gTop.addColorStop(0,   '#04111A');
      gTop.addColorStop(0.35,'rgba(4,17,26,0.85)');
      gTop.addColorStop(0.7, 'rgba(4,17,26,0.45)');
      gTop.addColorStop(1,   'rgba(4,17,26,0)');
      ctx.fillStyle = gTop;
      ctx.fillRect(dx, dy, dw, fade);
      // Bottom edge
      const gBot = ctx.createLinearGradient(0, dy + dh - fade, 0, dy + dh);
      gBot.addColorStop(0,   'rgba(4,17,26,0)');
      gBot.addColorStop(0.3, 'rgba(4,17,26,0.45)');
      gBot.addColorStop(0.65,'rgba(4,17,26,0.85)');
      gBot.addColorStop(1,   '#04111A');
      ctx.fillStyle = gBot;
      ctx.fillRect(dx, dy + dh - fade, dw, fade);
    }
  }

  function preload(){
    let next = 0;
    // Fewer parallel requests on mobile (better for cellular)
    const CONCURRENT = isMobile ? 4 : 8;
    function loadNext(){
      if (next >= FRAMES) return;
      const i = next++;
      const img = new Image();
      images[i] = img;
      img.onload = img.onerror = () => {
        loaded++;
        fill.style.transform = 'scaleX(' + (loaded / FRAMES) + ')';
        if (i === 0){ drawFrame(0); }
        if (loaded >= Math.min(24, FRAMES) && !readyToShow){
          readyToShow = true;
          loading.classList.add('hide');
          setTimeout(() => { loading.style.display = 'none'; }, 800);
        }
        loadNext();
      };
      img.decoding = 'async';
      img.src = framePath(i);
    }
    for (let k = 0; k < CONCURRENT; k++) loadNext();
  }

  // Scroll orchestration:
  //   y = 0        → leyenda 100% visible, viewer opacity 0, video frame 0
  //   y = 0.15·vh  → scrub starts advancing (video begins to progress)
  //   y = 0.4·vh   → viewer opacity reaches 1, leyenda fully faded out
  //   y = maxScroll→ viewer opacity 1, video at last frame + signature overlay
  //
  // maxScroll = total page (200vh) - viewport (100vh) = 100vh
  // scrub range: 15vh → 100vh = 85vh of scroll (fast + comfortable)
  function tick(){
    raf = 0;
    const y = window.scrollY || window.pageYOffset || 0;
    const vh = window.innerHeight;
    const maxScroll = Math.max(1, (document.documentElement.scrollHeight || document.body.scrollHeight) - vh);

    // Crossfade — quicker on mobile
    const fadeStart = 0;
    const fadeEnd   = vh * (isMobile ? 0.25 : 0.40);
    const alpha = Math.max(0, Math.min(1, (y - fadeStart) / (fadeEnd - fadeStart)));
    viewer.style.opacity = alpha;
    leyenda.style.opacity = 1 - alpha * 0.9;
    viewer.style.pointerEvents = alpha > 0.5 ? 'auto' : 'none';

    // Scrub — starts early, super snappy on mobile (one flick ≈ whole video)
    const scrubStart = vh * (isMobile ? 0.05 : 0.15);
    const scrubEnd   = maxScroll;
    const p = Math.max(0, Math.min(1, (y - scrubStart) / Math.max(1, (scrubEnd - scrubStart))));

    target = p * (FRAMES - 1);
    // Higher lerp on mobile so frames follow the finger with no perceived lag
    current += (target - current) * (isMobile ? 0.55 : 0.32);
    if (Math.abs(target - current) < 0.2) current = target;
    drawFrame(current);

    // Ending overlay
    if (p > 0.78) ending.classList.add('in');
    else ending.classList.remove('in');

    if (Math.abs(target - current) > 0.05){
      raf = requestAnimationFrame(tick);
    }
  }
  function onScroll(){ if (!raf) raf = requestAnimationFrame(tick); }

  window.addEventListener('scroll', onScroll, { passive:true });
  const onResize = () => { sizeCanvas(); drawFrame(current); onScroll(); };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  sizeCanvas();
  preload();
  setTimeout(onScroll, 200);
})();
</script>
</body>
</html>
