<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="/favicon_btg.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Formulario Builders · BTG Seguros</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#050F17;--dark2:#081A26;--blue:#1A7FBC;--blue2:#2AACE0;--cyan:#00C9E0;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%;background:var(--dark);color:#E4EEF5;font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;overflow:hidden;position:relative}

/* Background layers */
.bg{position:absolute;inset:0;z-index:0;background:
  radial-gradient(circle at 18% 25%,rgba(26,127,188,0.30),transparent 55%),
  radial-gradient(circle at 82% 75%,rgba(0,201,224,0.22),transparent 55%),
  linear-gradient(180deg,#050F17 0%,#081A26 100%)}
.grid{position:absolute;inset:0;z-index:0;opacity:.35;
  background-image:
    linear-gradient(rgba(42,172,224,0.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(42,172,224,0.08) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.stars{position:absolute;inset:0;z-index:0}
.stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.35;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.6}}

/* Card */
.card{position:relative;z-index:2;max-width:680px;width:100%;text-align:center;padding:56px 44px 48px;background:linear-gradient(180deg,rgba(4,14,26,0.72),rgba(4,14,26,0.55));border:1px solid rgba(42,172,224,0.22);border-radius:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 80px -20px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.02) inset}
.logo{height:38px;width:auto;margin:0 auto 30px;display:block;opacity:.9}

/* Crane */
.crane-wrap{width:280px;height:220px;margin:0 auto 32px;position:relative}
.crane-wrap svg{width:100%;height:100%;overflow:visible}
.crane-wrap .hook{transform-origin:340px 60px;animation:sway 4s ease-in-out infinite}
.crane-wrap .arm{transform-origin:160px 90px;animation:armRotate 12s ease-in-out infinite}
.crane-wrap .box{animation:boxLift 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes armRotate{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes boxLift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);background:rgba(0,201,224,0.08);border:1px solid rgba(0,201,224,0.32);border-radius:999px;margin-bottom:24px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

h1{font-size:42px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin-bottom:16px}
h1 .grad{background:linear-gradient(90deg,var(--blue2) 0%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:16px;line-height:1.6;color:rgba(228,238,245,0.65);max-width:440px;margin:0 auto}

/* Progress bar */
.progress{margin-top:36px;height:4px;width:100%;max-width:340px;margin-left:auto;margin-right:auto;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;position:relative}
.progress::after{content:"";position:absolute;top:0;left:-40%;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:load 2.4s ease-in-out infinite}
@keyframes load{0%{left:-40%}100%{left:100%}}

.foot{margin-top:38px;padding-top:22px;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(228,238,245,0.32)}
.foot .brand{color:rgba(228,238,245,0.5)}

@media (max-width:600px){
  .card{padding:40px 24px 34px}
  h1{font-size:30px}
  .crane-wrap{width:220px;height:170px;margin-bottom:24px}
  p{font-size:14px}
  .foot{flex-direction:column;gap:6px}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="stars">
  <i style="top:12%;left:18%;animation-delay:.2s"></i>
  <i style="top:22%;left:78%;animation-delay:.8s"></i>
  <i style="top:38%;left:8%;animation-delay:1.4s"></i>
  <i style="top:68%;left:88%;animation-delay:.6s"></i>
  <i style="top:82%;left:22%;animation-delay:2s"></i>
  <i style="top:14%;left:52%;animation-delay:1.1s"></i>
  <i style="top:58%;left:42%;animation-delay:1.7s"></i>
  <i style="top:76%;left:66%;animation-delay:.4s"></i>
</div>

<main class="card">
  <img src="/Logo_sitio_BTG.png" alt="BTG Seguros" class="logo">

  <div class="crane-wrap" aria-hidden="true">
    <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#2AACE0"/>
          <stop offset="100%" stop-color="#00C9E0"/>
        </linearGradient>
        <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2AACE0"/>
          <stop offset="100%" stop-color="#1A7FBC"/>
        </linearGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ground line -->
      <line x1="20" y1="270" x2="380" y2="270" stroke="rgba(42,172,224,0.35)" stroke-width="1.5" stroke-dasharray="4 6"/>

      <!-- base -->
      <polygon points="140,270 180,270 172,258 148,258" fill="url(#tower)" opacity=".9"/>

      <!-- vertical tower (lattice) -->
      <g stroke="url(#tower)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
        <line x1="152" y1="258" x2="152" y2="90"/>
        <line x1="168" y1="258" x2="168" y2="90"/>
        <!-- cross braces -->
        <line x1="152" y1="240" x2="168" y2="220"/>
        <line x1="168" y1="240" x2="152" y2="220"/>
        <line x1="152" y1="210" x2="168" y2="190"/>
        <line x1="168" y1="210" x2="152" y2="190"/>
        <line x1="152" y1="180" x2="168" y2="160"/>
        <line x1="168" y1="180" x2="152" y2="160"/>
        <line x1="152" y1="150" x2="168" y2="130"/>
        <line x1="168" y1="150" x2="152" y2="130"/>
        <line x1="152" y1="120" x2="168" y2="100"/>
        <line x1="168" y1="120" x2="152" y2="100"/>
        <!-- horizontals -->
        <line x1="152" y1="240" x2="168" y2="240"/>
        <line x1="152" y1="210" x2="168" y2="210"/>
        <line x1="152" y1="180" x2="168" y2="180"/>
        <line x1="152" y1="150" x2="168" y2="150"/>
        <line x1="152" y1="120" x2="168" y2="120"/>
        <line x1="152" y1="90" x2="168" y2="90"/>
      </g>

      <!-- rotating arm group -->
      <g class="arm">
        <!-- counterweight arm (left) -->
        <g stroke="url(#beam)" stroke-width="2.5" fill="none" stroke-linecap="round">
          <line x1="160" y1="80" x2="90" y2="80"/>
          <line x1="160" y1="95" x2="90" y2="95"/>
          <line x1="90" y1="80" x2="90" y2="95"/>
          <line x1="105" y1="80" x2="115" y2="95"/>
          <line x1="120" y1="80" x2="130" y2="95"/>
          <line x1="135" y1="80" x2="145" y2="95"/>
        </g>
        <!-- counterweight block -->
        <rect x="78" y="75" width="18" height="26" rx="2" fill="url(#tower)"/>

        <!-- cabin -->
        <rect x="150" y="72" width="22" height="20" rx="3" fill="url(#tower)"/>
        <rect x="154" y="76" width="6" height="6" fill="#00C9E0" opacity=".8"/>

        <!-- jib (main arm right) -->
        <g stroke="url(#beam)" stroke-width="2.5" fill="none" stroke-linecap="round">
          <line x1="170" y1="80" x2="345" y2="60"/>
          <line x1="170" y1="95" x2="345" y2="75"/>
          <line x1="345" y1="60" x2="345" y2="75"/>
          <!-- diagonals -->
          <line x1="190" y1="80" x2="200" y2="94"/>
          <line x1="215" y1="79" x2="225" y2="93"/>
          <line x1="240" y1="77" x2="250" y2="91"/>
          <line x1="265" y1="75" x2="275" y2="89"/>
          <line x1="290" y1="73" x2="300" y2="87"/>
          <line x1="315" y1="71" x2="325" y2="85"/>
        </g>

        <!-- top pinnacle triangle -->
        <polygon points="160,72 172,72 166,50" fill="none" stroke="url(#beam)" stroke-width="2"/>
        <!-- support cables from pinnacle -->
        <line x1="166" y1="50" x2="100" y2="80" stroke="rgba(42,172,224,0.55)" stroke-width="1.5"/>
        <line x1="166" y1="50" x2="340" y2="65" stroke="rgba(42,172,224,0.55)" stroke-width="1.5"/>

        <!-- hook cable + hook (swaying) -->
        <g class="hook">
          <line x1="340" y1="70" x2="340" y2="145" stroke="rgba(228,238,245,0.5)" stroke-width="1.2"/>
          <!-- hook -->
          <path d="M336,145 h8 v6 a4,4 0 0 1 -8,0" fill="none" stroke="#E4EEF5" stroke-width="1.8" stroke-linecap="round"/>
          <!-- payload box -->
          <g class="box">
            <rect x="325" y="155" width="30" height="22" rx="2" fill="url(#tower)" stroke="#00C9E0" stroke-width="1"/>
            <line x1="325" y1="166" x2="355" y2="166" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
            <line x1="340" y1="155" x2="340" y2="177" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
          </g>
        </g>
      </g>

      <!-- glowing dot on top -->
      <circle cx="166" cy="50" r="3" fill="#00C9E0" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </svg>
  </div>

  <div class="badge"><span class="dot"></span>En construcción</div>
  <h1>Formulario <span class="grad">en construcción</span></h1>
  <p>Nuestro equipo está preparando esta herramienta. Muy pronto podrás completar tu formulario aquí mismo.</p>

  <div class="progress" aria-hidden="true"></div>

  <div class="foot">
    <span class="brand">BTG Seguros · Builders</span>
    <span>Próximamente</span>
  </div>
</main>
</body>
</html>
